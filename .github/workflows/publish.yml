name: Render notebooks and publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install numpy matplotlib scikit-learn scipy jupyter nbconvert

      - name: Convert notebooks to HTML
        run: |
          mkdir -p docs
          jupyter nbconvert --to html format_a_explainer.ipynb --output docs/format_a_explainer.html --execute
          jupyter nbconvert --to html format_b_labnotebook.ipynb --output docs/format_b_labnotebook.html --execute
          cp index.qmd docs/index.md   # keep a copy of the source

      - name: Create index page
        run: |
          cat > docs/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <title>BME780: Figure Dissection Examples</title>
            <style>
              body { font-family: Georgia, serif; max-width: 700px; margin: 60px auto; padding: 0 20px; line-height: 1.6; color: #222; }
              h1 { font-size: 1.6em; border-bottom: 2px solid #ccc; padding-bottom: 10px; }
              h2 { font-size: 1.1em; margin-top: 2em; }
              a { color: #1a4e8a; }
              .card { border: 1px solid #ddd; border-radius: 6px; padding: 16px 20px; margin: 16px 0; }
              .badge { display:inline-block; margin-top:8px; }
            </style>
          </head>
          <body>
            <h1>BME780: Figure Dissection Assignment Examples</h1>
            <p>Examples based on Figure 4 (PCA of yeast sporulation gene expression) from <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC2669932/">Raychaudhuri, et al 2009.</a></p>
            <p>Data from  <a href="https://pubmed.ncbi.nlm.nih.gov/9784122/"> Chu et al 1998.</a> </p>
            <p> Two formats for this assignment are equally acceptable. The first is more focused on delivering a polished "explainer". The second is 
            focused on documenting the process of understanding the figure</p>

            <div class="card">
              <h2><a href="format_a_explainer.html">Format A: The Explainer</a></h2>
              <p> This should be more in the form of a polished report and follow the first half of the rubric. The emphasis here is on a clear, explanatory document more than on 
              the process of understanding the figure. You may include a worklog at the end of the document as evidence for your process, but it is not required. This version is good if you prefer structured, polished work before showing it. </p>
             
            </div>

            <div class="card">
              <h2><a href="format_b_labnotebook.html">Format B: Process-driven (more like a lab notebook)</a></h2>
              <p> This assignment should include raw, chronological, dated entries. The emphasis here is on documenting the process of understanding the figure, rather than on completeness or correctness.
              This version is good if you think by doing, and emphasizes making a genuine effort to understand the figure (and underlying methodology) rather than producing a polished document. </p>
            </div>

            <h2>Resources</h2>
            <ul>
              <li><a href="https://github.com/meganmcclean/bme780-figure-dissection/blob/main/assignment_prompt.md">Assignment Prompt</a></li>
              <li><a href="https://github.com/meganmcclean/bme780-figure-dissection/blob/main/rubric.md">Grading Rubric</a></li>
            </ul>
          </body>
          </html>
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
